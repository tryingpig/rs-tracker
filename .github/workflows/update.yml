name: update-rs-data
on:
  schedule:
    # GitHub은 정각·30분처럼 붐비는 슬롯의 schedule을 지연시키고, 심하면 버린다.
    # 실제로 '30 9'는 8/27 10시간, 8/28 11시간 밀린 끝에 8/31엔 실행 자체가 없었다.
    # → 임의의 분으로 옮기고, 주 슬롯이 누락돼도 그날 안에 채우도록 백업을 둔다.
    - cron: '12 9 * * 1-5'      # 18:12 KST (09:12 UTC), 평일 — 주 슬롯(약 14분 소요 → 18:27 완료)
    - cron: '23 13 * * 1-5'     # 22:23 KST (13:23 UTC), 평일 — 백업 슬롯
  workflow_dispatch:            # 수동 실행(파이프라인 검증용)
permissions:
  contents: write
concurrency:
  group: update-rs-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # Notion 'RS 섹터 보정 DB' → data/sector_override.csv (섹터 교정값 최신 반영)
      - name: Sync sector override from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_from_notion.py
      - name: build data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}   # data.krx.co.kr(KRX 정보데이터시스템) 회원 ID
          KRX_PW: ${{ secrets.KRX_PW }}   # 지수·구성종목 조회에 로그인 필요(pykrx 1.2.8+)
        # KRX가 순간적으로 JSON 대신 HTML을 반환하면 pykrx가 import 단계에서 죽는다
        # (auth.py login_krx 의 resp.json() 이 무방비). 2분 간격으로 3회까지 재시도.
        run: |
          for i in 1 2 3; do
            if python scripts/build_json.py; then exit 0; fi
            if [ "$i" -lt 3 ]; then
              echo "build 실패 — 재시도 $((i+1))/3 (120초 대기)"
              sleep 120
            fi
          done
          exit 1
      # 새로 생긴 '기타' 종목을 RS 섹터 보정 DB에 자동 추가(섹터 미지정·활성 OFF)
      - name: Push new unknown-sector stocks to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/push_unknown_to_notion.py
      - name: commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main   # 다른 실행과 겹쳐도 밀리지 않게
          git push

  # 섹터 캐시는 자주 안 바뀌므로 월 1회만 강제 갱신
  # needs: build → build 완료(push) 후 실행해 동시 push 충돌(race) 방지
  refresh-sectors:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: refresh sectors (1st business day only)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          if [ "$(date -u +%d)" -le "03" ]; then
            python scripts/build_json.py --refresh-sectors
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add data/
            git diff --staged --quiet || git commit -m "sectors: monthly refresh"
            # 이 잡은 워크플로 '시작 시점' 커밋을 체크아웃하므로, 그 사이 build 가
            # 밀어올린 data 커밋을 모르는 상태다. 그대로 push 하면 rejected 로
            # 잡이 빨갛게 뜬다(매달 1~3일에만 도는 잡이라 그때만 재현).
            git pull --rebase origin main
            git push
          else
            echo "이번 실행은 섹터 갱신 대상 아님(매월 초 3일 이내만)."
          fi
